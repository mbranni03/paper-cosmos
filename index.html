<meta charset="utf-8">
<title>Paper Cosmos</title>
<style>
  :root { --stage: #17140f; --text: #d9d0bf; --muted: #8a8172; --accent: #f26b2c; --ink: #2a2420; color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0; box-sizing: border-box; padding-inline: 16px; overflow: hidden;
    background: var(--stage); color: var(--text);
    display: grid; place-content: center; justify-items: center; gap: 12px;
    font: 12px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #stage { position: relative; width: min(calc(100vw - 32px), calc((100vh - 72px) * 16 / 9)); max-width: 100%; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #f4efe4; box-shadow: 0 18px 60px rgba(0, 0, 0, .55); cursor: pointer; }
  #play {
    position: absolute; left: 50%; top: 30%; translate: -50% -50%; font-size: clamp(9px, 2.2vw, 16px); width: 5.75em; height: 5.75em; padding: 0; cursor: pointer;
    border: 3px solid var(--ink); border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%;
    background: var(--accent); box-shadow: 3px 4px 0 var(--ink); transition: transform .15s;
  }
  #play::after { content: ""; position: absolute; left: 2.2em; top: 1.65em; border: 1.2em solid transparent; border-left: 1.75em solid var(--ink); border-right: 0; }
  #play:hover { transform: rotate(-4deg) scale(1.05); }
  #play:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
  #hint { margin: 0; color: var(--muted); letter-spacing: .04em; text-align: center; min-height: 1.4em; }
</style>

<div id="stage">
  <canvas id="c" width="1280" height="720" aria-label="Paper Cosmos: a 30 second hand-drawn animation"></canvas>
  <button id="play" aria-label="Play with sound"></button>
</div>
<p id="hint">space play/pause &middot; &larr;/&rarr; seek &middot; 1-0 jump to scene &middot; L loop</p>

<script>
'use strict';
// =====================================================================
//  TIMELINE - the one place to tweak pacing. Scene lengths are in beats;
//  visuals AND music are laid out from this table, so they stay in sync.
// =====================================================================
const BPM = 96;
const SCENES = [
  // id           beats  chord = [bass, ...pad voicing] (MIDI notes)
  ['intro',         6,   [38, 50, 57, 61, 64, 66]],  // Dmaj9      drop, blink, wave; rings open a portal
  ['neuron',        6,   [35, 47, 54, 57, 61, 62]],  // Bm9        cosmic flash -> blue neuron (B&W flash)
  ['prism',         4,   [40, 52, 59, 62, 66, 67]],  // Em9        glass prism splits white light
  ['dna',           4,   [33, 45, 52, 55, 62, 64]],  // A7sus4     rainbow twists into DNA -> spiral of dots
  ['sunflower',     4,   [38, 50, 57, 61, 66, 69]],  // Dmaj7      spiral locks into a sunflower, petals bloom
  ['flock',         6,   [31, 43, 50, 54, 57, 59]],  // Gmaj9      seeds scatter into a murmuration -> disc
  ['blackhole',     4,   [34, 46, 53, 57, 62, 64]],  // Bbmaj7#11  disc ignites around a black hole -> streak
  ['moon',          4,   [36, 48, 55, 62, 64, 69]],  // C6/9       streak flies over the moon toward Earth
  ['tunnel',        4,   [33, 45, 52, 55, 61, 64]],  // A7         warp into a fractal tunnel -> paper
  ['outro',         6,   [38, 50, 57, 59, 64, 66]],  // D6/9       character returns, arms up, ^ ^
];
const BEAT = 60 / BPM;
let acc = 0;
const S = SCENES.map(([id, beats, chord]) => ({ id, beats, chord, b0: acc, b1: acc += beats }));
const DUR = acc * BEAT;                 // 48 beats @ 96 bpm = 30 s
const SC = Object.fromEntries(S.map(s => [s.id, s]));
const POSTER = 2.1;                     // still frame shown before play

// ---------- math ----------
const W = 1280, H = 720, TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const ss = t => t * t * (3 - 2 * t);
const eio = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
const eout = t => 1 - (1 - t) ** 3;
const ein = t => t * t * t;
const eback = t => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2;   // ease-out with overshoot
const hash = n => { const s = Math.sin(n * 91.345 + 17.17) * 43758.5453; return s - Math.floor(s); };
const rng = a => () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mtof = m => 440 * 2 ** ((m - 69) / 12);

// ---------- canvas, textures, sprites ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
let BOIL = 0;                           // changes 12x/s: sketchy lines "boil" like hand-drawn frames

const PAPER = (() => {
  const c = mk(W, H), g = c.getContext('2d'), R = rng(11);
  g.fillStyle = '#f7f3ea'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 26; i++) {
    const x = R() * W, y = R() * H, r = 80 + R() * 320, gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, R() < .5 ? 'rgba(160,130,90,.035)' : 'rgba(255,255,250,.06)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  const im = g.getImageData(0, 0, W, H), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (R() - .5) * 12; d[i] += n; d[i + 1] += n; d[i + 2] += n * 1.15; }
  g.putImageData(im, 0, 0);
  g.lineWidth = 1; g.lineCap = 'round';
  for (let i = 0; i < 900; i++) {
    const x = R() * W, y = R() * H, a = R() * TAU, l = 3 + R() * 12;
    g.strokeStyle = R() < .7 ? 'rgba(110,90,60,.08)' : 'rgba(255,255,255,.4)';
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a) * l / 2 + (R() - .5) * 3, y + Math.sin(a) * l / 2 + (R() - .5) * 3, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  const v = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(95,70,40,.16)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  return c;
})();

const GRAIN = (() => {
  const c = mk(256, 256), g = c.getContext('2d'), im = g.createImageData(256, 256), R = rng(5);
  for (let i = 0; i < im.data.length; i += 4) { im.data[i] = im.data[i + 1] = im.data[i + 2] = 128 + (R() - .5) * 110; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return ctx.createPattern(c, 'repeat');
})();

const SPR = {};
function spr(col, soft) {            // cached radial sprite; soft = pure colour falloff (no hot core)
  const key = col + (soft ? 's' : '');
  if (SPR[key]) return SPR[key];
  const c = mk(64, 64), g = c.getContext('2d'), [r, gg, b] = hex(col), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  if (soft) { gr.addColorStop(0, `rgba(${r},${gg},${b},1)`); gr.addColorStop(.5, `rgba(${r},${gg},${b},.35)`); }
  else { gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.2, `rgba(${r},${gg},${b},.85)`); gr.addColorStop(.5, `rgba(${r},${gg},${b},.22)`); }
  gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return SPR[key] = c;
}
function glow(col, x, y, r, a = 1, soft) { if (a <= 0 || r <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(spr(col, soft), x - r, y - r, 2 * r, 2 * r); }
const additive = f => { ctx.save(); ctx.globalCompositeOperation = 'lighter'; f(); ctx.restore(); };

// ---------- sketchy strokes ----------
const jit = (k, a) => (hash(k * 7.31 + BOIL * 13.7) - .5) * 2 * a;
function sline(x1, y1, x2, y2, a = 1.2, id = 0, passes = 2) {   // hand-drawn segment (adds to current path)
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
  for (let p = 0; p < passes; p++) {
    const k = id * 3.7 + p * 11.1, bow = jit(k, a * 1.5 + len * .006);
    ctx.moveTo(x1 + jit(k + 1, a), y1 + jit(k + 2, a));
    ctx.quadraticCurveTo((x1 + x2) / 2 + nx * bow, (y1 + y2) / 2 + ny * bow, x2 + jit(k + 3, a), y2 + jit(k + 4, a));
  }
}
function sellipse(cx, cy, rx, ry, id = 0, a = .04, passes = 2) { // wobbly loop that overshoots its start
  for (let p = 0; p < passes; p++) {
    const k = id * 5.1 + p * 9.3, ph = hash(k + BOIL) * TAU, ph2 = hash(k * 2 + BOIL) * TAU, st = hash(k * 3 + BOIL) * TAU, n = 44;
    for (let i = 0; i <= n + 3; i++) {
      const t = st + i / n * TAU, w = 1 + a * (Math.sin(t * 2 + ph) * .6 + Math.sin(t * 3 + ph2) * .4) + (i > n ? a * (i - n) * .6 : 0);
      i ? ctx.lineTo(cx + Math.cos(t) * rx * w, cy + Math.sin(t) * ry * w) : ctx.moveTo(cx + Math.cos(t) * rx * w, cy + Math.sin(t) * ry * w);
    }
  }
}

// ---------- the mascot ----------
const ORANGE = '#f26b2c', INK = '#2a2420', GY = 468, CX0 = 640;   // ground line y, character x
function drawChar(x, y, o = {}) {        // (x, y) = feet on the ground
  const { sx = 1, sy = 1, rot = 0, armL = .35, armR = .35, eyes = 'open', blink = 0, scale = 1 } = o;
  if (scale <= .002) return;
  const bw = 58, bh = 72, leg = 12, top = -leg - bh, L = -bw / 2, R = bw / 2, B = -leg;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.translate(0, -48); ctx.scale(scale, scale); ctx.translate(0, 48);   // shrink about the body centre
  ctx.scale(sx, sy);                                                      // squash about the feet
  ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = INK;
  ctx.lineWidth = 5.5; ctx.beginPath(); sline(-12, B - 2, -12, 0, .6, 1, 1); sline(12, B - 2, 12, 0, .6, 2, 1); ctx.stroke();
  const ay = top + bh * .4, al = 19;                                      // arms: 0 = hanging, PI = straight up
  ctx.beginPath();
  sline(L + 1, ay, L + 1 - Math.sin(armL) * al, ay + Math.cos(armL) * al, .6, 3, 1);
  sline(R - 1, ay, R - 1 + Math.sin(armR) * al, ay + Math.cos(armR) * al, .6, 4, 1);
  ctx.stroke();
  ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.roundRect(L + 2.5, top + 2, bw, bh, 8); ctx.fill();   // misregistered print fill
  ctx.save(); ctx.clip(); ctx.strokeStyle = 'rgba(165,50,10,.32)'; ctx.lineWidth = 1.4; ctx.beginPath();
  for (let i = 0; i < 6; i++) sline(R - 14 + i * 4, top + 6, R - 24 + i * 4, B - 4, .5, 20 + i, 1);
  ctx.stroke(); ctx.restore();
  ctx.lineWidth = 2.6; ctx.beginPath();
  sline(L, top, R, top, .9, 5); sline(R, top, R, B, .9, 6); sline(R, B, L, B, .9, 7); sline(L, B, L, top, .9, 8);
  ctx.stroke();
  const ey = top + 26;
  if (eyes === 'happy') {
    ctx.lineWidth = 3; ctx.beginPath();
    for (const ex of [-11, 11]) { ctx.moveTo(ex - 5, ey + 3); ctx.lineTo(ex, ey - 3); ctx.lineTo(ex + 5, ey + 3); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(225,60,80,.35)';
    for (const ex of [-19, 19]) { ctx.beginPath(); ctx.ellipse(ex, ey + 11, 5, 3, 0, 0, TAU); ctx.fill(); }
  } else {
    const eh = Math.max(1.6, 9 * (1 - blink));
    ctx.fillStyle = INK; for (const ex of [-11, 11]) ctx.fillRect(ex - 4, ey - eh / 2, 8, eh);
    if (blink < .5) { ctx.fillStyle = '#fff'; for (const ex of [-11, 11]) ctx.fillRect(ex - 2, ey - 3, 2.2, 2.2); }
  }
  ctx.restore();
}
function drop(b, land) {                 // 1-beat gravity fall, then a springy squash
  if (b < land) { const f = clamp(b - land + 1); return { y: lerp(-40, GY, f * f), sx: .9, sy: 1.12, arm: 2.4 }; }
  const t = (b - land) * BEAT, q = .32 * Math.exp(-7 * t) * Math.cos(21 * t);
  return { y: GY, sx: 1 + q * .8, sy: 1 - q, arm: .35 + 2 * Math.exp(-10 * t) };
}
function rings(e, a = 1) {              // ripples from the character (e = beats relative to the intro's end); ring 0 is the portal edge
  ctx.lineCap = 'round'; ctx.globalAlpha = a;
  for (let k = 0; k < 5; k++) {
    const r = 950 * inv(-1.75 + k * .3, -.1 + k * .3, e) ** 2; if (r <= 1 || r > 940) continue;
    ctx.strokeStyle = k === 0 ? INK : k % 2 ? 'rgba(242,107,44,.9)' : 'rgba(244,239,228,.75)';
    ctx.lineWidth = k === 0 ? 3.5 : 2.2; ctx.beginPath(); sellipse(CX0, FY, r, r, 40 + k, .015); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function faintLine(a = 1, grow = 1) {
  if (grow <= 0) return;
  const L = 540 * grow;
  ctx.strokeStyle = `rgba(70,58,45,${.42 * a})`; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); sline(CX0 - L, GY + 1, CX0, GY, 1, 31); sline(CX0, GY, CX0 + L, GY + 1, 1, 32); ctx.stroke();
}
function shadow(y) {
  const k = clamp(1 - (GY - y) / 520), s = .5 + .5 * k;
  ctx.fillStyle = `rgba(60,40,20,${.16 * k})`; ctx.beginPath(); ctx.ellipse(CX0, GY + 2, 34 * s, 5 * s, 0, 0, TAU); ctx.fill();
}

// ---------- shared space bits ----------
const STARS = Array.from({ length: 260 }, (_, i) => ({ x: hash(i + .1) * W, y: hash(i + .2) * H, r: .6 + hash(i + .3) ** 4 * 2.2, p: hash(i + .4) * TAU }));
function drawStars(T, a = 1, dx = 0) {
  ctx.fillStyle = '#fff8ea';
  for (const s of STARS) {
    const k = a * (.55 + .45 * Math.sin(T * 1.7 + s.p)); if (k < .03) continue;
    ctx.globalAlpha = k; ctx.fillRect(((s.x + dx) % W + W) % W, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;
}
const NEB = [[.28, .32, 330, '#3a2a8c'], [.74, .28, 360, '#0f5a78'], [.56, .72, 380, '#7a2a6e'], [.16, .76, 280, '#1d3f8f'], [.88, .74, 260, '#6b1f4f']];
function drawCosmos(T, a = 1) {
  ctx.fillStyle = '#070a1c'; ctx.fillRect(0, 0, W, H);
  additive(() => { for (const [x, y, r, c] of NEB) glow(c, x * W + 30 * Math.sin(T * .3 + x * 7), y * H, r, .5 * a, true); });
  drawStars(T, a);
}
const FX = CX0, FY = GY - 48;             // flash point = where the character vanished
const BURST = ['#ffd27a', '#7fd8ff', '#ff8fc8', '#b69cff', '#9dffcf', '#ffffff'];

// =====================================================================
//  SCENES - each draws the full frame for its local beat b (0..beats)
// =====================================================================
const DRAW = {
  intro(b, s, T) {
    ctx.drawImage(PAPER, 0, 0);
    faintLine();
    const d = drop(b, 1), cy = FY;
    shadow(d.y);
    const blink = Math.sin(Math.PI * inv(2, 2.18, b));
    const wave = inv(2.4, 2.6, b) * (1 - inv(4.1, 4.3, b));
    const armR = lerp(d.arm, 2.55 + .4 * Math.sin((b - 2.4) * TAU * 1.6), wave);
    const e = b - s.beats, portal = 950 * inv(-1.75, -.1, e) ** 2;   // concentric rings open onto the cosmos
    if (portal > 0) {
      ctx.save(); ctx.beginPath(); ctx.arc(CX0, cy, portal, 0, TAU); ctx.clip(); drawCosmos(T); ctx.restore();
      rings(e);
    }
    const shrink = inv(-.9, -.15, e);                       // the character condenses into a star...
    drawChar(CX0, d.y, { sx: d.sx, sy: d.sy, armL: d.arm, armR, blink, scale: 1 - ein(shrink), rot: .05 * wave * Math.sin((b - 2.4) * TAU * .8) });
    if (shrink > 0) additive(() => glow('#fff1c9', CX0, cy, 6 + 44 * shrink, shrink));
  },

  neuron(b, s, T) {                                          // ...which bursts: the cosmic flash -> a neuron
    const e = b - s.beats, zoom = 1.12 + .22 * ss(inv(.3, s.beats - 1, b));
    const D = NEURON.maxD * eout(inv(.3, 2.3, b)) * (1 - ein(inv(-1.7, -.6, e)));   // grow out, later retract
    const mp = eio(inv(-1.5, -.1, e));                         // soma -> prism, axon -> light beam
    if (b >= 3 && b < 3.5) {                                   // flash to the pencil drawing underneath
      ctx.drawImage(PAPER, 0, 0);
      drawNeuron(zoom, D, 'pencil');
      ctx.strokeStyle = INK; ctx.lineWidth = 2.2; ctx.beginPath(); sellipse(FX, FY, 30 * zoom, 28 * zoom, 70, .08); ctx.stroke();
      ctx.save(); ctx.beginPath(); ctx.arc(FX, FY, 30 * zoom, 0, TAU); ctx.clip(); ctx.lineWidth = 1; ctx.beginPath();
      for (let k = -6; k <= 6; k++) sline(FX + k * 6 - 30, FY - 40, FX + k * 6 + 30, FY + 40, .8, 80 + k, 1);
      ctx.stroke(); ctx.restore();
      ctx.beginPath(); sellipse(FX + 3, FY - 2, 10 * zoom, 9 * zoom, 71, .1); ctx.stroke();
      return;
    }
    drawCosmos(T, 1 - .6 * inv(1, 3, b));
    if (b < .8) rings(b, 1 - b / .8);
    ctx.fillStyle = `rgba(5,5,7,${inv(-1.6, -.2, e)})`; ctx.fillRect(0, 0, W, H);
    const f = 1 - Math.exp(-3.2 * b), fade = clamp(1.3 - b * .35);
    additive(() => {
      for (let i = 0; i < 240; i++) {                        // star burst decelerating outward
        const a = hash(i * 3.3) * TAU, v = 120 + hash(i * 5.1) * 700, r = v * f, x = FX + Math.cos(a) * r, y = FY + Math.sin(a) * r;
        if (b < .5) { ctx.strokeStyle = BURST[i % 6]; ctx.globalAlpha = .5 * (1 - b * 2); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(FX + Math.cos(a) * r * .75, FY + Math.sin(a) * r * .75); ctx.stroke(); }
        glow(BURST[i % 6], x, y, 2 + hash(i) * 5, fade);
      }
    });
    drawNeuron(zoom, D, 'glow');
    // axon straightens into the white beam that will hit the prism
    const ax = NEURON.axon, vis = eout(inv(.3, 2, b)) * ax.length;
    const pts = ax.slice(0, Math.max(2, Math.ceil(vis))).map(([x, y], k) => {
      const bx = lerp(E1[0], BEAM0[0], k / (ax.length - 1)), by = lerp(E1[1], BEAM0[1], k / (ax.length - 1));
      return [lerp(FX + x * zoom, bx, mp), lerp(FY + y * zoom, by, mp)];
    });
    glowLine(pts, 5.5 * zoom * (1 - mp) + 4 * mp, mp > .5 ? '#ffffff' : '#5fb4ff', 1);
    // soma: pulses on every beat, then morphs into the prism outline
    const pulse = b > 1 && e < -1.6 ? Math.exp(-7 * (b % 1)) : 0;
    const M = 48, poly = [];
    for (let k = 0; k < M; k++) {
      const th = -Math.PI / 2 + k / M * TAU, w = 1 + .08 * Math.sin(th * 3 + T * 2), tp = triPoint(k / M);
      poly.push([lerp(FX + Math.cos(th) * 30 * zoom * w, tp[0], mp), lerp(FY + Math.sin(th) * 30 * zoom * w, tp[1], mp)]);
    }
    ctx.beginPath(); poly.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
    const sg = ctx.createRadialGradient(FX - 6, FY - 6, 2, FX, FY, 34 * zoom);
    sg.addColorStop(0, `rgba(235,250,255,${1 - mp})`); sg.addColorStop(.45, `rgba(110,200,255,${.95 * (1 - mp)})`); sg.addColorStop(1, `rgba(30,95,214,${.9 * (1 - mp)})`);
    ctx.fillStyle = sg; ctx.fill(); ctx.fillStyle = `rgba(210,230,255,${.07 * mp})`; ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${.25 + .6 * mp})`; ctx.lineWidth = 1.6; ctx.stroke();
    additive(() => {
      glow('#7fd0ff', FX, FY, (70 + 40 * pulse) * zoom, (.8 + .4 * pulse) * (1 - mp));
      glow('#ffffff', FX, FY, 16 * zoom, (1 - mp));
      for (let j = 0; j < NEURON.paths.length; j++) {        // signals racing from the dendrites to the soma
        const path = NEURON.paths[j], u = ((b - 1.1) * .9 + hash(j * 1.7)) % 1, dd = path[0].d1 * (1 - u);
        if (b < 1.1 || e > -1.7 || dd > D) continue;
        const sgm = path.find(q => q.d0 <= dd && dd <= q.d1); if (!sgm) continue;
        const k = (dd - sgm.d0) / (sgm.d1 - sgm.d0);
        glow('#e6fbff', FX + zoom * lerp(sgm.x1, sgm.x2, k), FY + zoom * lerp(sgm.y1, sgm.y2, k), 8, .9);
      }
      const fl = clamp(1 - b / .7); glow('#ffffff', FX, FY, 60 + 900 * (1 - fl), fl * fl * 1.5);   // the flash itself
    });
  },

  prism(b, s, T) {                                           // Dark Side energy: white light in, spectrum out
    ctx.fillStyle = '#050507'; ctx.fillRect(0, 0, W, H);
    const hb = Math.exp(-5 * (b % 2)) * (b < 3.9 ? 1 : 0);   // heartbeat glow on beats 0 and 2
